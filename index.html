<!DOCTYPE html>

    <style>
        /* ===== TUS ESTILOS BASE (sin cambios) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;

            background: #000;
            position: fixed;
            top: 0;
            left: 0;
        }
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #000;
        }

        #urlDisplay {
            position: fixed;
            bottom: 80px;
            left: 10px;
            z-index: 99999;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #0f0;
            pointer-events: none;
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
        }
        #urlDisplay.url-visible {
            opacity: 0.9;
            visibility: visible;
        }

        .mirror-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #fbbd14;
            color: #000;
            font-size: 10px;
            font-weight: bold;
            border-radius: 50%;
            min-width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #000;
            pointer-events: none;
            padding: 0 4px;
        }

        .custom-header-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9998;
            pointer-events: auto;
            background: transparent;
            border-bottom: none;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .overlay-buttons-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            width: auto;
            gap: 0;
        }
        .domain-toggle-btn,
        #ntvMinimalBtn {
            border-radius: 50% !important;
            width: 34px;
            height: 34px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: none;
            margin: 3px 0 10px 0;
            transform: none;
            background: #343a50;
            border: 1px solid #f59e0b;
            position: relative;
            cursor: pointer;
            transition: all 0.18s ease;
        }
        #ntvMinimalBtn {
            margin-right: 6px;
        }
        .domain-toggle-btn:active,
        #ntvMinimalBtn:active {
            transform: scale(0.92);
        }
        .domain-toggle-btn.mode-mirror {
            background: #fbbd14;
            border-color: #fbbd14;
        }
        .domain-toggle-btn .material-symbols-outlined,
        #ntvMinimalBtn .material-symbols-outlined {
            font-size: 1.1rem;
            color: #787f91;
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
        }
        .mirror-badge {
            top: -4px;
            right: -4px;
            min-width: 16px;
            height: 16px;
            font-size: 9px;
        }

        @media (min-width: 1024px) and (orientation: landscape) {
            .domain-toggle-btn,
            #ntvMinimalBtn {
                width: 40px;
                height: 40px;
                margin: 2px 0;
            }
            #ntvMinimalBtn {
                margin-right: 6px;
            }
        }

        #urlDisplay {
            bottom: 80px;
        }

        @media (orientation: landscape) and (min-width: 768px) {
            #urlDisplay {
                bottom: 20px;
            }
        }

        /* ===== NUEVOS ESTILOS (desde 999999.html) ===== */

        .source-toggle-btn {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            background: #100f15;
            border: none;
            color: #cccbd9;
            padding: 8px 12px;
            cursor: pointer;
            transition: 0.2s;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 64px;
            height: auto;
            border-radius: 0;
            gap: 2px;
        }
        .source-toggle-btn .material-symbols-outlined {
            font-size: 1.7rem;
            color: #cccbd9;
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            transition: color 0.2s;
            line-height: 1;
        }
        .source-toggle-btn .source-label {
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 0.3px;
            color: #cccbd9;
            transition: color 0.2s;
            line-height: 1.2;
            margin-top: 0px;
        }
        .source-toggle-btn:active {
            transform: translateX(-50%) scale(0.92);
        }
        body:not(.ntv-mode) .source-toggle-btn { display: none !important; }

        body.ntv-mode .source-toggle-btn {
            bottom: 1px;
            min-width: unset;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            padding: 0;
            gap: 10px;
            transform: translateX(-50%);
            background: #100f15;
            border: none;
            box-shadow: none;
        }
        body.ntv-mode .source-toggle-btn .material-symbols-outlined {
            font-size: 1.8rem;
        }
        body.ntv-mode .source-toggle-btn .source-label {
            font-size: 0.75rem;
            margin-top: 0;
            line-height: 1;
        }

        #ntvMirrorToggleBtn {
            position: fixed;
            bottom: 24px;
            right: 20px;
            z-index: 10001;
            background: #100f15;
            border: none;
            color: #cccbd9;
            padding: 0;
            cursor: pointer;
            transition: 0.2s;
            font-family: system-ui, sans-serif;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
            width: 60px;
            height: 60px;
            border-radius: 0;
        }
        #ntvMirrorToggleBtn .material-symbols-outlined {
            font-size: 1.7rem;
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            color: #cccbd9;
        }
        #ntvMirrorToggleBtn .ntv-index-label {
            color: #cccbd9;
            font-size: 1.05rem;
            font-weight: bold;
            margin: 0;
        }
        #ntvMirrorToggleBtn:active { transform: scale(0.92); }
        .custom-header-overlay.hidden { display: none !important; }

        body.ntv-mode #ntvMirrorToggleBtn {
            bottom: 1px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            padding: 0;
            gap: 5;
            background: #100f15;
            border: none;
            box-shadow: none;
        }
        body.ntv-mode #ntvMirrorToggleBtn .material-symbols-outlined {
            font-size: 1.7rem;
        }
        body.ntv-mode #ntvMirrorToggleBtn .ntv-index-label {
            font-size: 1.05rem;
            margin: 0;
        }

        @media (max-width: 480px) {
            .source-toggle-btn { min-width: 56px; padding: 6px 10px; bottom: 20px; }
            .source-toggle-btn .material-symbols-outlined { font-size: 1.5rem; }
            .source-toggle-btn .source-label { font-size: 0.7rem; }
            #ntvMirrorToggleBtn { width: 52px; height: 52px; bottom: 20px; right: 16px; }
            #ntvMirrorToggleBtn .material-symbols-outlined { font-size: 1.5rem; }
            #ntvMirrorToggleBtn .ntv-index-label { font-size: 0.9rem; }

            body.ntv-mode .source-toggle-btn {
                bottom: 4px;
                width: 56px;
                height: 56px;
                gap: 4px;
            }
            body.ntv-mode .source-toggle-btn .material-symbols-outlined { font-size: 1.6rem; }
            body.ntv-mode .source-toggle-btn .source-label { font-size: 0.7rem; }

            body.ntv-mode #ntvMirrorToggleBtn {
                bottom: 4px;
                width: 52px;
                height: 52px;
            }
            body.ntv-mode #ntvMirrorToggleBtn .material-symbols-outlined { font-size: 1.5rem; }
            body.ntv-mode #ntvMirrorToggleBtn .ntv-index-label { font-size: 0.95rem; }
        }
        @media (max-width: 380px) {
            .source-toggle-btn { min-width: 48px; padding: 5px 8px; bottom: 16px; }
            .source-toggle-btn .material-symbols-outlined { font-size: 1.3rem; }
            .source-toggle-btn .source-label { font-size: 0.6rem; }
            #ntvMirrorToggleBtn { width: 44px; height: 44px; bottom: 16px; right: 12px; }
            #ntvMirrorToggleBtn .material-symbols-outlined { font-size: 1.3rem; }
            #ntvMirrorToggleBtn .ntv-index-label { font-size: 0.8rem; }

            body.ntv-mode .source-toggle-btn {
                bottom: 3px;
                width: 48px;
                height: 48px;
                gap: 3px;
            }
            body.ntv-mode .source-toggle-btn .material-symbols-outlined { font-size: 1.4rem; }
            body.ntv-mode .source-toggle-btn .source-label { font-size: 0.65rem; }

            body.ntv-mode #ntvMirrorToggleBtn {
                bottom: 3px;
                width: 44px;
                height: 44px;
            }
            body.ntv-mode #ntvMirrorToggleBtn .material-symbols-outlined { font-size: 1.3rem; }
            body.ntv-mode #ntvMirrorToggleBtn .ntv-index-label { font-size: 0.85rem; }
        }

        /* === Landscape: barra arriba === */
        @media (orientation: landscape) and (min-width: 768px) {
            .source-toggle-btn {
                top: 10px !important;
                bottom: auto !important;
                left: 50% !important;
                transform: translateX(-50%) !important;
            }
            body.ntv-mode .source-toggle-btn {
                top: 10px !important;
                bottom: auto !important;
            }

            #ntvMirrorToggleBtn {
                top: 10px !important;
                bottom: auto !important;

            }

                bottom: auto !important;
            }

            #urlDisplay {
                bottom: 20px;
            }

                bottom: 20px;

        }

        @media (orientation: landscape) and (min-width: 1200px) {
            .source-toggle-btn {
                top: 16px !important;
            }
            #ntvMirrorToggleBtn {
                top: 16px !important;
                right: 30px !important;
            }
        }
    </style>
</head>
<body>

<div class="iframe-container">
    <iframe id="streamFrame" title="Live Streaming" allow="autoplay; fullscreen; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>

<div id="urlDisplay">Cargando...</div>

<!-- === NUEVOS BOTONES (en lugar de los flotantes de la derecha) === -->
<button id="sourceToggleBtn" class="source-toggle-btn">
    <span class="material-symbols-outlined">language</span>
    <span class="source-label">NTV</span>
</button>

<button id="ntvMirrorToggleBtn">
    <span class="material-symbols-outlined">linear_scale</span>
    <span class="ntv-index-label">1</span>
</button>

<!-- Botones flotantes superiores (FCTV) -->
<div class="custom-header-overlay" id="headerOverlay">
    <div class="overlay-buttons-grid" id="customButtonsGrid">
        <button class="custom-sport-btn" id="ntvMinimalBtn" aria-label="Cambiar a NTV">
            <span class="material-symbols-outlined">language</span>
        </button>
        <button class="custom-sport-btn domain-toggle-btn" id="domainToggleBtn" aria-label="Cambiar mirror">
            <span class="material-symbols-outlined">linear_scale</span>
            <span class="mirror-badge" id="mirrorBadge">0</span>
        </button>
    </div>
</div>

<script>
    // ---- Protección contra rotación (sin cambios) ----
    (function() {
        if (window.screen && window.screen.orientation) {
            const originalLock = window.screen.orientation.lock;
            window.screen.orientation.lock = function() {
                return Promise.reject(new DOMException("No permitido", "NotAllowedError"));
            };
            if (window.screen.orientation.unlock) window.screen.orientation.unlock = function() {};
        }
    })();

    // ---- CONSTANTES ----
    const FCTV_SOURCE_1 = "https://hubu.ru/fctvlink";
    const FCTV_SOURCE_2 = "https://hubu.ru/sp77link";
    const NTV_SOURCE = "https://NTVx.link";
    const NTV_FALLBACK_MIRRORS = ['https://ntv.st/', 'https://ntvs.cx/'];

    // ---- Estado ----
    let fctvMirrors = [];
    let fctvIndex = 0;
    let ntvMirrors = [];
    let ntvIndex = 0;
    let currentSource = 'fctv';       // 'fctv' o 'ntv'

    // ---- DOM ----
    const iframe = document.getElementById('streamFrame');
    const urlDisplay = document.getElementById('urlDisplay');
    const domainToggleBtn = document.getElementById('domainToggleBtn');
    const mirrorBadge = document.getElementById('mirrorBadge');
    const headerOverlay = document.getElementById('headerOverlay');
    const ntvMinimalBtn = document.getElementById('ntvMinimalBtn');

    const sourceToggleBtn = document.getElementById('sourceToggleBtn');
    const sourceLabel = sourceToggleBtn.querySelector('.source-label');
    const ntvMirrorToggleBtn = document.getElementById('ntvMirrorToggleBtn');
    const ntvIndexLabel = ntvMirrorToggleBtn.querySelector('.ntv-index-label');

    // ---- Almacenamiento seguro (nunca debe romper la app) ----
    function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function safeRemove(k) { try { localStorage.removeItem(k); } catch (e) {} }
    function loadCache(k) {
        try {
            const a = JSON.parse(safeGet(k) || '[]');
            return Array.isArray(a) ? a.filter(u => typeof u === 'string' && /^https?:\/\//i.test(u)) : [];
        } catch (e) { return []; }
    }
    function saveCache(k, arr) { if (arr && arr.length) safeSet(k, JSON.stringify(arr)); }

    // fetch con timeout: si Jina se cuelga, NO deja la app congelada
    async function fetchWithTimeout(url, ms = 8000) {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), ms);
        try { return await fetch(url, { signal: ctrl.signal, cache: 'no-store' }); }
        finally { clearTimeout(t); }
    }
    async function fetchTextRetry(url) {
        for (let i = 0; i < 2; i++) {
            try {
                const r = await fetchWithTimeout('https://r.jina.ai/' + url);
                if (r.ok) return await r.text();
            } catch (e) {}
        }
        throw new Error('sin respuesta de ' + url);
    }

    // ---- Utilidades ----
    function updateUrlDisplay(url) {
        if (url) {
            urlDisplay.textContent = url;
            console.log('[URL] iframe cargando:', url);
        } else {
            urlDisplay.textContent = 'Sin enlaces · doble toque para reintentar';
            console.log('[URL] iframe vacío');
        }
    }

    function cleanBaseUrl(url) {
        if (!url) return '';
        return url.replace(/[()"']/g, '').trim();
    }

    // ---- Extracción con Jina AI ----
    async function fetchUrlFromSource(sourceUrl, sourceLabel) {
        try {
            console.log(`[${sourceLabel}] Extrayendo de ${sourceUrl}...`);
            const text = await fetchTextRetry(sourceUrl);

            const linkRegex = /🔗\s*Link\s*\(?(https?:\/\/[^\s)]+)/i;
            const match = text.match(linkRegex);
            let result = null;

            if (match) {
                result = cleanBaseUrl(match[1]);
                console.log(`[${sourceLabel}] Enlace principal encontrado por patrón:`, result);
            } else {
                const urlRegex = /(?:https?:\/\/[^\s"'<>]+)/gi;
                const matches = text.match(urlRegex) || [];
                let cleaned = matches.map(u => cleanBaseUrl(u));
                let unique = [...new Set(cleaned)];
                const filtered = unique.filter(url => !url.includes('hubu.ru') && !url.includes('NTVx.link'));
                if (filtered.length > 0) {
                    result = filtered[0];
                    console.log(`[${sourceLabel}] Enlace principal por filtro (primero no-hubu):`, result);
                } else {
                    console.warn(`[${sourceLabel}] No se encontró enlace principal.`);
                }
            }
            return result;
        } catch (e) {
            console.warn(`[${sourceLabel}] Error:`, e);
            return null;
        }
    }

    // ---- Refrescar mirrors (siempre desde las fuentes) ----
    let fctvRefreshing = null;
    function refreshFctvMirrors() {
        if (!fctvRefreshing) fctvRefreshing = _refreshFctvMirrors().finally(() => { fctvRefreshing = null; });
        return fctvRefreshing;
    }
    async function _refreshFctvMirrors() {
        const results = await Promise.all([
            fetchUrlFromSource(FCTV_SOURCE_1, 'fctvlink'),
            fetchUrlFromSource(FCTV_SOURCE_2, 'sp77link')
        ]);

        const mirrorsFromFctvlink = results[0] ? [results[0]] : [];
        const mirrorsFromSp77link = results[1] ? [results[1]] : [];

        const combined = [...mirrorsFromFctvlink, ...mirrorsFromSp77link];
        const fresh = [...new Set(combined)];
        if (fresh.length > 0) {
            fctvMirrors = fresh;
            saveCache('fctv_mirrors_cache', fresh);
        } else if (fctvMirrors.length === 0) {
            // Sin red / Jina caído: usar los últimos mirrors buenos conocidos
            fctvMirrors = loadCache('fctv_mirrors_cache');
            console.warn('[FCTV] Sin mirrors nuevos, usando caché:', fctvMirrors);
        }

        // No guardamos el array en localStorage, solo el índice
        console.log('[FCTV] Total mirrors combinados:', fctvMirrors);
        return fctvMirrors;
    }

    // NTVx.link es un INDEXADOR de URLs activas, no un mirror en sí mismo.
    // Por eso nunca debe terminar dentro de ntvMirrors: solo se usa como fuente
    // para extraer los mirrors reales que lista en su interior.
    function isIndexerUrl(url) {
        const low = url.toLowerCase();
        return low.includes('ntvx.link') || low.includes('hubu.ru') || low.includes('r.jina.ai');
    }

    async function fetchNtvMirrorLinks(sourceUrl) {
        try {
            console.log(`[NTVx.link] Extrayendo mirrors de ${sourceUrl}...`);
            const text = await fetchTextRetry(sourceUrl);

            // 1) Intentar capturar TODAS las líneas con el patrón "🔗 Link (url)"
            //    (con /g para no quedarnos solo con la primera coincidencia)
            const linkRegex = /🔗\s*Link\s*\(?(https?:\/\/[^\s)]+)/gi;
            let found = [];
            let match;
            while ((match = linkRegex.exec(text)) !== null) {
                found.push(cleanBaseUrl(match[1]));
            }

            if (found.length > 0) {
                console.log(`[NTVx.link] ${found.length} enlace(s) encontrados por patrón 🔗 Link:`, found);
            } else {
                // 2) Fallback: extraer todas las URLs del texto y descartar
                //    el propio indexador y demás dominios no válidos
                const urlRegex = /(?:https?:\/\/[^\s"'<>]+)/gi;
                const matches = text.match(urlRegex) || [];
                found = matches.map(u => cleanBaseUrl(u));
                console.log('[NTVx.link] Enlaces encontrados por filtro genérico:', found);
            }

            // Quitar duplicados y descartar SIEMPRE el propio ntvx.link (no es un mirror)
            const unique = [...new Set(found)];
            const filtered = unique.filter(url => url && !isIndexerUrl(url));

            console.log('[NTVx.link] Mirrors válidos tras filtrar el indexador:', filtered);
            return filtered;
        } catch (e) {
            console.warn('[NTVx.link] Error:', e);
            return [];
        }
    }

    let ntvRefreshing = null;
    function refreshNtvMirrors() {
        if (!ntvRefreshing) ntvRefreshing = _refreshNtvMirrors().finally(() => { ntvRefreshing = null; });
        return ntvRefreshing;
    }
    async function _refreshNtvMirrors() {
        const extracted = await fetchNtvMirrorLinks(NTV_SOURCE);
        let combined = [...extracted];
        for (let fallback of NTV_FALLBACK_MIRRORS) {
            const clean = cleanBaseUrl(fallback);
            if (!combined.some(u => u.toLowerCase() === clean.toLowerCase())) {
                combined.push(clean);
            }
        }
        // Blindaje final: aunque algo se colara, nunca dejar que ntvx.link
        // (el indexador) quede como mirror seleccionable
        ntvMirrors = combined.filter(url => !isIndexerUrl(url));
        saveCache('ntv_mirrors_cache', ntvMirrors);

        console.log('[NTV] Total mirrors (extraídos de NTVx.link + respaldos, indexador excluido):', ntvMirrors);
        return ntvMirrors;
    }

    // ---- Obtener URL base (con índice actual) ----
    function getCurrentBaseUrl() {
        if (currentSource === 'fctv') {
            if (fctvMirrors.length === 0) return null;
            const idx = fctvIndex % fctvMirrors.length;
            return cleanBaseUrl(fctvMirrors[idx]);
        } else {
            if (ntvMirrors.length === 0) return null;
            const idx = ntvIndex % ntvMirrors.length;
            return cleanBaseUrl(ntvMirrors[idx]);
        }
    }

    // ---- Navegación ----
    function loadStream(url) {
        if (url) {
            iframe.src = url;
            updateUrlDisplay(url);
        } else {
            iframe.src = 'about:blank';
            updateUrlDisplay(null);
        }
    }

    function loadCurrentSource() {
        const base = getCurrentBaseUrl();
        if (!base) {
            loadStream(null);
            return;
        }
        loadStream(base.replace(/\/+$/, ''));
    }

    // ---- Actualizar indicadores ----
    function updateMirrorBadge() {
        let total = 0;
        let current = 0;
        if (currentSource === 'fctv') {
            total = fctvMirrors.length;
            current = (total > 0) ? fctvIndex % total : 0;
        } else {
            total = ntvMirrors.length;
            current = (total > 0) ? ntvIndex % total : 0;
        }
        if (total > 0) {
            mirrorBadge.textContent = current + 1;
            mirrorBadge.style.display = 'flex';
        } else {
            mirrorBadge.textContent = '!';
            mirrorBadge.style.display = 'flex';
        }
        const ntvTotal = ntvMirrors.length || 0;
        const ntvVal = ntvTotal > 0 ? (ntvIndex % ntvTotal) + 1 : '!';
        ntvIndexLabel.textContent = ntvVal;
    }

    function updateDomainToggleButton() {
        let isFirst = false;
        if (currentSource === 'fctv') {
            isFirst = (fctvIndex === 0);
        } else {
            isFirst = (ntvIndex === 0);
        }
        if (isFirst) {
            domainToggleBtn.classList.remove('mode-mirror');
            domainToggleBtn.classList.add('mode-original');
        } else {
            domainToggleBtn.classList.remove('mode-original');
            domainToggleBtn.classList.add('mode-mirror');
        }
        updateMirrorBadge();
        const base = getCurrentBaseUrl();
        console.log(`[${currentSource.toUpperCase()}] Mirror actual: ${mirrorBadge.textContent}/${(currentSource==='fctv'?fctvMirrors.length:ntvMirrors.length)} - ${base}`);
    }

    // ---- Acciones principales ----
    async function setSource(source) {
        if (source === currentSource) return;
        currentSource = source;
        safeSet('fctv_source', currentSource);

        // Asegurar que los mirrors están cargados
        if (source === 'fctv' && fctvMirrors.length === 0) {
            await refreshFctvMirrors();
        }
        if (source === 'ntv' && ntvMirrors.length === 0) {
            await refreshNtvMirrors();
        }

        if (source === 'ntv') {
            document.body.classList.add('ntv-mode');
            sourceLabel.textContent = 'NTV';
            headerOverlay.classList.add('hidden');
            ntvMirrorToggleBtn.style.display = 'flex';
            loadCurrentSource();
        } else {
            document.body.classList.remove('ntv-mode');
            sourceLabel.textContent = 'FCTV';
            headerOverlay.classList.remove('hidden');
            ntvMirrorToggleBtn.style.display = 'none';
            loadCurrentSource();
        }
        updateDomainToggleButton();
        if (navigator.vibrate) navigator.vibrate(20);
    }

    function toggleSource() {
        if (currentSource === 'fctv') {
            setSource('ntv');
        } else {
            setSource('fctv');
        }
    }

    async function toggleMirror() {
        if (currentSource === 'fctv') {
            if (fctvMirrors.length === 0) {
                await refreshFctvMirrors();
            }
            if (fctvMirrors.length === 0) {
                loadStream(null);
                updateDomainToggleButton();
                return;
            }
            fctvIndex = (fctvIndex + 1) % fctvMirrors.length;
            safeSet('fctv_index', String(fctvIndex));
        } else {
            if (ntvMirrors.length === 0) {
                await refreshNtvMirrors();
            }
            if (ntvMirrors.length === 0) {
                loadStream(null);
                updateDomainToggleButton();
                return;
            }
            ntvIndex = (ntvIndex + 1) % ntvMirrors.length;
            safeSet('ntv_index', String(ntvIndex));
        }
        loadCurrentSource();
        updateDomainToggleButton();
        if (navigator.vibrate) navigator.vibrate(30);
    }

    async function refreshCurrentMirrors() {
        if (currentSource === 'fctv') {
            await refreshFctvMirrors();
            fctvIndex = 0;
            safeSet('fctv_index', '0');
        } else {
            await refreshNtvMirrors();
            ntvIndex = 0;
            safeSet('ntv_index', '0');
        }
        loadCurrentSource();
        updateDomainToggleButton();
        if (navigator.vibrate) navigator.vibrate([50,30,50]);
    }

    // ---- Inicialización mejorada ----
    async function init() {
        // Leer estados persistentes (no los mirrors)
        const savedSource = safeGet('fctv_source');
        if (savedSource === 'fctv' || savedSource === 'ntv') {
            currentSource = savedSource;
        }

        // Leer índices guardados
        const savedFctvIdx = safeGet('fctv_index');
        if (savedFctvIdx !== null) {
            const idx = parseInt(savedFctvIdx, 10);
            if (!isNaN(idx)) fctvIndex = idx;
        }
        const savedNtvIdx = safeGet('ntv_index');
        if (savedNtvIdx !== null) {
            const idx = parseInt(savedNtvIdx, 10);
            if (!isNaN(idx)) ntvIndex = idx;
        }

        // 1) Arrancar YA con la caché (la app nunca espera a la red)
        fctvMirrors = loadCache('fctv_mirrors_cache');
        ntvMirrors = loadCache('ntv_mirrors_cache');
        for (const f of NTV_FALLBACK_MIRRORS) {
            if (!ntvMirrors.some(u => u.toLowerCase() === f.toLowerCase())) ntvMirrors.push(f);
        }
        // Aplicar estado
        if (currentSource === 'ntv') {
            document.body.classList.add('ntv-mode');
            sourceLabel.textContent = 'NTV';
            headerOverlay.classList.add('hidden');
            ntvMirrorToggleBtn.style.display = 'flex';
        } else {
            document.body.classList.remove('ntv-mode');
            sourceLabel.textContent = 'FCTV';
            headerOverlay.classList.remove('hidden');
            ntvMirrorToggleBtn.style.display = 'none';
        }
        loadCurrentSource();
        updateDomainToggleButton();

        // 2) Refrescar en segundo plano (con timeout) y recargar solo si hace falta
        const hadBase = getCurrentBaseUrl();
        await Promise.all([refreshFctvMirrors(), refreshNtvMirrors()]);
        if (fctvIndex >= fctvMirrors.length) { fctvIndex = 0; safeSet('fctv_index', '0'); }
        if (ntvIndex >= ntvMirrors.length) { ntvIndex = 0; safeSet('ntv_index', '0'); }
        if (getCurrentBaseUrl() !== hadBase) loadCurrentSource();
        updateDomainToggleButton();
        console.log('[Init] Completado. Source:', currentSource, 'FCTV mirrors:', fctvMirrors.length, 'NTV mirrors:', ntvMirrors.length);
    }

    // ---- EVENTOS ----
    sourceToggleBtn.addEventListener('click', toggleSource);

    ntvMirrorToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMirror();
    });

    ntvMirrorToggleBtn.addEventListener('dblclick', async (e) => {
        e.stopPropagation();
        await refreshCurrentMirrors();
    });

    domainToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMirror();
    });

    domainToggleBtn.addEventListener('dblclick', async (e) => {
        e.stopPropagation();
        await refreshCurrentMirrors();
    });

    ntvMinimalBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentSource === 'fctv') {
            setSource('ntv');
        }
    });

    // ---- Guardar estado al salir ----
    window.addEventListener('beforeunload', () => {
        safeSet('fctv_source', currentSource);
        if (fctvMirrors.length > 0) {
            safeSet('fctv_index', String(fctvIndex));
        } else {
            safeRemove('fctv_index');
        }
        if (ntvMirrors.length > 0) {
            safeSet('ntv_index', String(ntvIndex));
        } else {
            safeRemove('ntv_index');
        }
    });

    // Auto-reparación: abrir la web con ?reset limpia todo sin reinstalar el navegador
    if (/[?&]reset\b/.test(location.search)) {
        try { localStorage.clear(); } catch (e) {}
        try { if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))); } catch (e) {}
        try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())); } catch (e) {}
    }

    // Iniciar
    init().catch(err => console.error("Error en init:", err));

    // ---- PWA (opcional) ----
    (function setupPWA() {
        function createIcon(size, text, bgColor, textColor) {

            ctx.fillRect(0, 0, size, size);
            const grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, '#1f2f3a');
            grad.addColorStop(1, '#0a1219');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, size, size);
            ctx.strokeStyle = '#fbbd14';
            ctx.lineWidth = size * 0.03;
            ctx.strokeRect(size*0.1, size*0.1, size*0.8, size*0.8);
            ctx.fillStyle = textColor;
            ctx.font = `bold ${size * 0.28}px "Segoe UI", system-ui`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, size/2, size/2);
            ctx.font = `${size * 0.09}px monospace`;
            ctx.fillStyle = "#fbbd14";
            ctx.fillText("LIVE", size/2, size * 0.8);
            return canvas.toDataURL('image/png');
        }
        const icon192 = createIcon(192, "F33", "#0f1722", "#ffffff");
        const icon512 = createIcon(512, "FCTV", "#0f1722", "#ffffff");
        const manifestObj = {
            name: "TU TV 22",

            start_url: ".",
            display: "standalone",
            theme_color: "#0a0a0a",
            background_color: "#000000",
            icons: [
                { src: icon192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
                { src: icon512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestObj)], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(manifestBlob);
        const manifestLink = document.getElementById('manifest-link');
        if (manifestLink) manifestLink.href = manifestURL;
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log("[PWA] SW no registrado", err));
            });
        }
    })();
</script>
